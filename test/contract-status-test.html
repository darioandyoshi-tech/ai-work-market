<!DOCTYPE html>
<html>
<head>
    <title>AWM Contract Status Test</title>
</head>
<body>
    <h1>AWM Contract Status Test</h1>
    <div>
        <label for="contractId">Contract ID:</label>
        <input type="number" id="contractId" value="2">
    </div>
    <button onclick="checkStatus()">Check Status</button>
    <div id="result" style="margin-top: 20px; padding: 10px; border: 1px solid #ccc; min-height: 50px;"></div>
    <script>
        async function checkStatus() {
            const contractId = document.getElementById('contractId').value;
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Loading...';
            
            try {
                const response = await fetch(`/api/contract-status?id=${contractId}&network=sepolia`);
                const data = await response.json();
                resultDiv.innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (error) {
                resultDiv.innerHTML = '<span style="color: red;">Error: ' + error.message + '</span>';
            }
        }
    </script>
</body>
</html>
